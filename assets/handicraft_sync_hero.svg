<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c120c" />
      <stop offset="50%" stop-color="#142416" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2e1d" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f1d12" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Main Card -->
  <rect x="80" y="80" width="1040" height="470" rx="16" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="2" />

  <!-- Badge -->
  <rect x="120" y="120" width="240" height="36" rx="18" fill="#166534" />
  <text x="240" y="144" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">WAY #83 | CATEGORY E</text>

  <!-- Title & Subtitle -->
  <text x="120" y="210" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">Artisan Store &amp; Multi-Channel Sync Suite</text>
  <text x="120" y="255" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20">Atomic Stock Reconciliation across Shopify, Etsy, WooCommerce &amp; Edge Webhooks</text>

  <!-- Metric Badges -->
  <g transform="translate(120, 290)">
    <rect x="0" y="0" width="180" height="70" rx="10" fill="#0f1d12" stroke="#22543d" stroke-width="1.5" />
    <text x="20" y="28" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">INVENTORY LOCK</text>
    <text x="20" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Atomic &lt; 5ms</text>
  </g>

  <g transform="translate(320, 290)">
    <rect x="0" y="0" width="180" height="70" rx="10" fill="#0f1d12" stroke="#22543d" stroke-width="1.5" />
    <text x="20" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">SYNC CHANNELS</text>
    <text x="20" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Shopify &bull; Etsy &bull; Woo</text>
  </g>

  <g transform="translate(520, 290)">
    <rect x="0" y="0" width="180" height="70" rx="10" fill="#0f1d12" stroke="#22543d" stroke-width="1.5" />
    <text x="20" y="28" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PROVENANCE</text>
    <text x="20" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Fair-Trade Safe</text>
  </g>

  <g transform="translate(720, 290)">
    <rect x="0" y="0" width="180" height="70" rx="10" fill="#0f1d12" stroke="#22543d" stroke-width="1.5" />
    <text x="20" y="28" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AGENCY RETAINER</text>
    <text x="20" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">$500 - $3,000</text>
  </g>

  <!-- Footer Info -->
  <line x1="120" y1="400" x2="1080" y2="400" stroke="#22543d" stroke-width="1" />
  <text x="120" y="445" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Cloudflare Workers Edge + D1 SQL • Multi-Channel Token Bucket Rate Limiting • Dual-Currency Invoicing</text>
  <text x="120" y="475" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Nexus Digital Products Catalog • Milind Chatrabhuji • Modern Evidence-Based Standard</text>
</svg>